<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Duty — Company Management</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Duty</h1>
    <span class="topbar-sub">Company Management</span>
  </header>

  <nav id="navBar" class="navbar"></nav>

  <main class="container">
    <div class="toolbar">
      <input id="searchInput" type="text" placeholder="Search by name or email..." />
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
      <button id="addBtn" class="btn btn-primary">+ Add Company</button>
    </div>

    <div id="alertBox" class="alert" hidden></div>

    <table class="data-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Status</th>
          <th>Created</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="companyTableBody">
        <tr><td colspan="6" class="empty">Loading...</td></tr>
      </tbody>
    </table>

    <div class="pagination" id="pagination"></div>
  </main>

  <!-- Add/Edit Modal -->
  <div id="companyModal" class="modal-overlay" hidden>
    <div class="modal">
      <h2 id="modalTitle">Add Company</h2>
      <form id="companyForm">
        <input type="hidden" id="companyId" />

        <label>Company Name *</label>
        <input type="text" id="name" required maxlength="150" />
        <span class="field-error" id="err-name"></span>

        <label>Email *</label>
        <input type="email" id="email" required maxlength="150" />
        <span class="field-error" id="err-email"></span>

        <label>Phone *</label>
        <input type="text" id="phone" required maxlength="30" />
        <span class="field-error" id="err-phone"></span>

        <label>Address</label>
        <input type="text" id="address" maxlength="255" />

        <label>Status</label>
        <select id="status">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>

        <div class="modal-actions">
          <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation -->
  <div id="deleteModal" class="modal-overlay" hidden>
    <div class="modal modal-small">
      <h2>Delete Company?</h2>
      <p>This action cannot be undone. Are you sure you want to delete <strong id="deleteCompanyName"></strong>?</p>
      <div class="modal-actions">
        <button type="button" id="cancelDeleteBtn" class="btn btn-secondary">Cancel</button>
        <button type="button" id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>renderNav('companies');</script>
  <script src="js/company.js"></script>
</body>
</html>
