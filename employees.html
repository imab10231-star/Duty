<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Duty — Employee Management</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Duty</h1>
    <span class="topbar-sub">Employee Management</span>
  </header>

  <nav id="navBar" class="navbar"></nav>

  <main class="container">
    <div id="noCompanyNotice" class="alert alert-error" hidden>
      Add a company first (Companies tab) before adding employees.
    </div>

    <div class="toolbar">
      <input id="searchInput" type="text" placeholder="Search by name, ID, or email..." />
      <select id="departmentFilter"><option value="">All departments</option></select>
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
      <button id="addBtn" class="btn btn-primary">+ Add Employee</button>
    </div>

    <div id="alertBox" class="alert" hidden></div>

    <table class="data-table">
      <thead>
        <tr>
          <th>Employee ID</th>
          <th>Name</th>
          <th>Phone</th>
          <th>Department</th>
          <th>Designation</th>
          <th>Shift</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="employeeTableBody">
        <tr><td colspan="8" class="empty">Loading...</td></tr>
      </tbody>
    </table>

    <div class="pagination" id="pagination"></div>
  </main>

  <!-- Add/Edit Modal -->
  <div id="employeeModal" class="modal-overlay" hidden>
    <div class="modal">
      <h2 id="modalTitle">Add Employee</h2>
      <form id="employeeForm">
        <input type="hidden" id="employeeRowId" />

        <label>Employee ID *</label>
        <input type="text" id="employee_id" required maxlength="30" />
        <span class="field-error" id="err-employee_id"></span>

        <label>Name *</label>
        <input type="text" id="name" required maxlength="150" />
        <span class="field-error" id="err-name"></span>

        <label>Phone *</label>
        <input type="text" id="phone" required maxlength="30" />
        <span class="field-error" id="err-phone"></span>

        <label>Email</label>
        <input type="email" id="email" maxlength="150" />
        <span class="field-error" id="err-email"></span>

        <label>Department</label>
        <div class="inline-add">
          <select id="department_id"><option value="">— None —</option></select>
          <button type="button" class="btn-link" onclick="quickAdd('department')">+ New</button>
        </div>

        <label>Designation</label>
        <div class="inline-add">
          <select id="designation_id"><option value="">— None —</option></select>
          <button type="button" class="btn-link" onclick="quickAdd('designation')">+ New</button>
        </div>

        <label>Shift</label>
        <div class="inline-add">
          <select id="shift_id"><option value="">— None —</option></select>
          <a href="shifts.html" class="btn-link" target="_blank" rel="noopener">Manage shifts</a>
        </div>

        <label>Joining Date *</label>
        <input type="date" id="joining_date" required />
        <span class="field-error" id="err-joining_date"></span>

        <label>Salary *</label>
        <input type="number" id="salary" min="0" step="0.01" required />
        <span class="field-error" id="err-salary"></span>

        <label>Status</label>
        <select id="status">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>

        <div class="modal-actions">
          <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation -->
  <div id="deleteModal" class="modal-overlay" hidden>
    <div class="modal modal-small">
      <h2>Delete Employee?</h2>
      <p>This action cannot be undone. Are you sure you want to delete <strong id="deleteEmployeeName"></strong>?</p>
      <div class="modal-actions">
        <button type="button" id="cancelDeleteBtn" class="btn btn-secondary">Cancel</button>
        <button type="button" id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>renderNav('employees');</script>
  <script src="js/employee.js"></script>
</body>
</html>
